<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1E6B45">
<meta name="robots" content="noindex">
<title>Tropen im Einkaufswagen – Das große Abschluss-Quiz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B4%3C/text%3E%3C/svg%3E">
<style>
:root{
  --green:#1E6B45; --green-d:#14502F; --green-l:#E3F1E8;
  --cocoa:#6B3F24; --banana:#F4C430; --banana-l:#FFF4CC;
  --bg:#FBF6EC; --card:#FFFFFF; --ink:#2A2118; --muted:#6E6257; --line:#E8DFD0;
  --ok:#23894F; --ok-l:#E2F4E8; --bad:#D4502F; --bad-l:#FCE7E1;
  --accent:#1E6B45; --accent-ink:#FFFFFF; --accent-l:#E3F1E8;
  --radius:24px;
  --shadow:0 10px 30px rgba(74,52,30,.10), 0 2px 6px rgba(74,52,30,.06);
  font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-size:20px; line-height:1.45;
  min-height:100vh; min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit; touch-action:manipulation; cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:4px solid #1F7FA6; outline-offset:3px}

/* Deko-Blätter */
.deco{position:fixed; pointer-events:none; z-index:0; opacity:.16}
.deco.tl{top:-30px; left:-40px; width:230px; transform:rotate(-10deg)}
.deco.br{bottom:-40px; right:-40px; width:260px; transform:rotate(170deg)}

/* Kopfleiste */
.topbar{
  position:sticky; top:0; z-index:5;
  background:rgba(251,246,236,.94);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  padding:12px 20px 10px; padding-top:max(12px, env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:860px; margin:0 auto; display:flex; align-items:center; gap:16px}
.progress{flex:1; height:16px; background:#EDE4D3; border-radius:99px; overflow:hidden}
.progress > div{height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .5s ease, background .3s}
.progress-label{font-size:16px; color:var(--muted); white-space:nowrap; min-width:92px; text-align:right}
.score-pill{
  background:var(--banana-l); border:2px solid var(--banana); border-radius:99px;
  padding:4px 14px; font-weight:700; font-size:18px; white-space:nowrap;
}
.score-pill.bump{animation:bump .5s ease}
.hidden{display:none !important}

main{position:relative; z-index:1; max-width:860px; margin:0 auto; padding:24px 20px 48px}
.card{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:32px 32px 28px; animation:slideIn .35s ease both;
}
@media (max-width:600px){ .card{padding:24px 18px 22px} main{padding:16px 12px 40px} body{font-size:19px} }

/* Startbildschirm */
.start{text-align:center; padding-top:36px}
.start h1{font-size:40px; line-height:1.15; margin:8px 0 6px; color:var(--green-d); letter-spacing:-.5px}
.start h1 span{display:block; font-size:26px; color:var(--cocoa); font-weight:700; margin-top:8px; letter-spacing:0}
.start p{max-width:560px; margin:14px auto; color:var(--ink)}
.hero{width:min(340px, 80%); height:auto; display:block; margin:0 auto}
.facts{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:18px 0 26px}
.facts span{background:var(--green-l); color:var(--green-d); border-radius:99px; padding:6px 16px; font-size:17px; font-weight:600}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  min-height:64px; padding:14px 34px; border:none; border-radius:20px;
  background:var(--accent); color:var(--accent-ink); font-size:22px; font-weight:700;
  box-shadow:0 5px 0 rgba(0,0,0,.18); transition:transform .1s, box-shadow .1s, opacity .2s;
}
.btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.4; box-shadow:none}
.btn.big{min-width:260px; font-size:24px}
.btn.green{background:var(--green); color:#fff}
.btn.light{background:#fff; color:var(--ink); border:3px solid var(--line); box-shadow:0 5px 0 var(--line)}
.btn-row{display:flex; flex-wrap:wrap; justify-content:center; gap:16px; margin-top:26px}

/* Fragen-Kopf */
.qhead{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:18px}
.chip{
  display:inline-flex; align-items:center; gap:6px; border-radius:99px;
  padding:6px 14px; font-size:16px; font-weight:700;
}
.chip.round{background:var(--accent); color:var(--accent-ink)}
.chip.sheet{background:#fff; border:2px dashed var(--accent); color:var(--ink)}
.chip.num{background:#F3EDE2; color:var(--muted); margin-left:auto}
.tools{display:flex; gap:12px; margin:0 0 6px}
.tool{
  display:inline-flex; align-items:center; gap:8px; min-height:52px; padding:8px 18px;
  border-radius:16px; border:2px solid var(--line); background:#fff; font-size:18px; font-weight:600;
}
.tool[aria-pressed="true"]{background:var(--banana-l); border-color:var(--banana)}
.tool .ico{font-size:24px; line-height:1}
.lead{font-size:19px; font-weight:700; color:var(--accent-text, var(--accent)); margin:14px 0 2px}
.qtext{font-size:27px; line-height:1.3; font-weight:700; margin:4px 0 12px}
@media (max-width:600px){ .qtext{font-size:23px} }
.term{
  display:flex; gap:10px; align-items:flex-start;
  background:#F4F8FB; border-left:6px solid #1F7FA6; border-radius:12px;
  padding:10px 14px; font-size:18px; margin:6px 0 10px;
}
.term b{white-space:nowrap}
.hintbox{
  display:flex; gap:12px; align-items:flex-start; background:var(--banana-l);
  border:2px solid var(--banana); border-radius:16px; padding:12px 16px; margin:8px 0 12px;
  animation:pop .3s ease;
}
.hintbox .ico{font-size:28px; line-height:1}
.body{margin-top:18px}

/* Antwort-Optionen */
.opts{display:grid; gap:14px}
@media (min-width:640px){ .opts.two{grid-template-columns:1fr 1fr} }
.opt{
  display:flex; align-items:center; gap:14px; text-align:left;
  min-height:72px; padding:14px 18px; border-radius:18px;
  background:#fff; border:3px solid var(--line); font-size:21px; font-weight:600;
  box-shadow:0 4px 0 var(--line); transition:transform .1s, border-color .2s, background .2s;
}
.opt:active:not(:disabled){transform:translateY(2px); box-shadow:0 2px 0 var(--line)}
.opt .letter{
  flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
  background:var(--accent-l); color:var(--accent-text, var(--accent)); font-weight:800; font-size:19px;
}
.opt .em{font-size:30px; line-height:1; flex:none}
.opt.sel{border-color:var(--accent); background:var(--accent-l); box-shadow:0 4px 0 var(--accent)}
.opt.sel .letter{background:var(--accent); color:var(--accent-ink)}
.opt.ok{border-color:var(--ok); background:var(--ok-l); box-shadow:0 4px 0 var(--ok); animation:pop .4s ease}
.opt.ok .letter{background:var(--ok); color:#fff}
.opt.bad{border-color:var(--bad); background:var(--bad-l); box-shadow:0 4px 0 var(--bad); animation:shake .4s ease}
.opt.bad .letter{background:var(--bad); color:#fff}
.opt.miss{border-color:var(--ok); border-style:dashed}
.opt:disabled{cursor:default}
.opt .check{margin-left:auto; flex:none; width:32px; height:32px; border-radius:10px; border:3px solid var(--line); display:grid; place-items:center; font-size:18px; color:transparent}
.opt.sel .check{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.opt.ok .check{background:var(--ok); border-color:var(--ok); color:#fff}
.opt.bad .check{background:var(--bad); border-color:var(--bad); color:#fff}
.tf .opt{justify-content:center; font-size:26px; min-height:96px}
.tf .opt .em{font-size:36px}

/* Detektiv */
.detect-wrap{display:grid; gap:18px}
@media (min-width:700px){ .detect-wrap{grid-template-columns:1fr 1fr} }
.pack{
  border:3px solid #CDBFA9; border-radius:18px; background:#FFFDF7; overflow:hidden;
}
.pack-head{display:flex; align-items:center; gap:10px; background:#F3EADA; padding:10px 16px; font-weight:800}
.pack-head .em{font-size:30px}
.pack-body{padding:12px 14px 16px}
.pack-body small{display:block; color:var(--muted); font-size:15px; margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; font-weight:700}
.ingr{display:flex; flex-wrap:wrap; gap:10px}
.ingr .opt{min-height:56px; padding:8px 14px; font-size:19px; border-radius:14px}
.example-note{font-size:16px; color:var(--muted); margin:10px 0 0; text-align:center}

/* Zuordnen */
.pool{
  display:flex; flex-wrap:wrap; gap:12px; justify-content:center; min-height:84px;
  padding:14px; border-radius:18px; background:#F7F1E6; border:2px dashed #DCCFB8; margin-bottom:18px;
}
.pool.empty::after{content:"Alle Karten sind verteilt ✔"; color:var(--muted); font-size:17px; align-self:center}
.mcard{
  display:inline-flex; align-items:center; gap:10px; min-height:60px; padding:10px 16px;
  border-radius:16px; background:#fff; border:3px solid var(--line); box-shadow:0 4px 0 var(--line);
  font-size:19px; font-weight:600; text-align:left; max-width:100%;
}
.mcard .em{font-size:28px; line-height:1}
.mcard.sel{border-color:var(--accent); background:var(--accent-l); box-shadow:0 4px 0 var(--accent); transform:translateY(-3px) scale(1.03)}
.mcard.ok{border-color:var(--ok); background:var(--ok-l); box-shadow:0 4px 0 var(--ok)}
.mcard.bad{border-color:var(--bad); background:var(--bad-l); box-shadow:0 4px 0 var(--bad); animation:shake .4s ease}
.mcard.fixed{border-style:dashed}
.targets{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media (max-width:560px){ .targets{grid-template-columns:1fr} }
.target{
  display:flex; flex-direction:column; gap:10px; align-items:stretch;
  min-height:200px; padding:14px; border-radius:20px; text-align:left;
  background:#fff; border:3px dashed var(--accent); transition:background .2s, transform .15s;
}
.target.ready{background:var(--accent-l); border-style:solid; animation:glow 1.4s ease infinite}
.target-title{display:flex; align-items:center; gap:10px; font-weight:800; font-size:21px; padding-bottom:6px; border-bottom:2px solid var(--line)}
.target-title .em{font-size:32px; line-height:1}
.target .mcard{width:100%}
.howto{font-size:17px; color:var(--muted); text-align:center; margin:-4px 0 12px}

/* Lückentext */
.gaptext{font-size:24px; line-height:2.3; background:#FFFDF7; border:2px solid var(--line); border-radius:18px; padding:16px 20px}
.gap{
  display:inline-flex; align-items:center; justify-content:center; min-width:140px; min-height:50px;
  padding:4px 14px; margin:0 4px; vertical-align:middle; line-height:1.2;
  border-radius:12px; border:3px dashed #BFAF95; background:#fff; font-size:22px; font-weight:700; color:var(--ink);
}
.gap.active{border-color:var(--accent); border-style:solid; background:var(--accent-l); animation:glow 1.4s ease infinite}
.gap.filled{border-style:solid; border-color:var(--accent)}
.gap.ok{border-color:var(--ok); background:var(--ok-l); border-style:solid}
.gap.bad{border-color:var(--bad); background:var(--bad-l); border-style:solid; animation:shake .4s ease}
.bank{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:18px}
.bank .mcard{font-size:21px; min-width:110px; justify-content:center}
.bank .mcard.used{opacity:.25; box-shadow:none}

/* Meinung */
.proscons{display:grid; gap:16px; margin-top:20px; animation:slideIn .4s ease both}
@media (min-width:640px){ .proscons{grid-template-columns:1fr 1fr} }
.pc{border-radius:18px; padding:16px 18px}
.pc h3{margin:0 0 8px; font-size:20px}
.pc ul{margin:0; padding-left:22px}
.pc li{margin:6px 0; font-size:19px}
.pc.pro{background:var(--ok-l); border:2px solid #9ED3B2}
.pc.con{background:#FFF1E2; border:2px solid #F0C08F}

/* Rückmeldung */
.actions{display:flex; justify-content:center; margin-top:24px}
.feedback{
  display:flex; gap:14px; align-items:flex-start; border-radius:18px; padding:16px 18px; margin-top:22px;
  animation:pop .35s ease;
}
.feedback .big{font-size:36px; line-height:1}
.feedback h3{margin:0 0 4px; font-size:22px}
.feedback p{margin:0; font-size:19px}
.feedback.ok{background:var(--ok-l); border:3px solid var(--ok)}
.feedback.retry{background:var(--banana-l); border:3px solid var(--banana)}
.feedback.sol{background:#FFF1E2; border:3px solid #E59A4E}
.feedback.neutral{background:#F4F8FB; border:3px solid #1F7FA6}
.feedback .say{margin-left:auto; flex:none; min-height:48px; padding:6px 12px; font-size:22px; border-radius:14px; border:2px solid rgba(0,0,0,.12); background:#fff}
.plus{
  position:fixed; z-index:20; font-size:34px; font-weight:800; color:var(--ok);
  pointer-events:none; animation:floatUp 1s ease forwards;
}

/* Runden-Screens */
.center{text-align:center}
.round-emoji{font-size:84px; line-height:1.1; margin:6px 0 4px; animation:pop .5s ease}
.round-kicker{font-weight:800; color:var(--muted); letter-spacing:1px; text-transform:uppercase; font-size:16px}
.round-title{font-size:34px; line-height:1.2; margin:6px 0 12px; color:var(--ink)}
.round-intro{max-width:560px; margin:10px auto 0}
.meta{color:var(--muted); font-size:18px; margin-top:12px}
.stat{
  display:inline-flex; flex-direction:column; align-items:center; gap:2px; min-width:200px;
  padding:16px 26px; border-radius:20px; background:var(--accent-l); margin:12px 8px 0;
}
.stat b{font-size:40px; line-height:1.1; color:var(--accent-text, var(--accent))}
.stat span{font-size:17px; color:var(--muted)}
.motiv{font-size:22px; font-weight:700; margin:20px auto 0; max-width:560px}

/* Ergebnis */
.stars{display:flex; justify-content:center; gap:10px; margin:10px 0}
.stars svg{width:72px; height:72px}
.stars svg.on{animation:starIn .6s ease both}
.stars svg:nth-child(2){animation-delay:.2s}
.stars svg:nth-child(3){animation-delay:.4s}
.badge{width:170px; height:auto; display:block; margin:6px auto 0; animation:pop .6s ease}
.badge-name{font-size:30px; font-weight:800; color:var(--green-d); margin:4px 0 0}
.teacher{
  display:flex; align-items:center; justify-content:center; gap:12px; margin:22px auto 0; max-width:520px;
  background:var(--banana-l); border:3px solid var(--banana); border-radius:18px; padding:14px 18px; font-weight:700; font-size:21px;
}
.teacher .em{font-size:32px}
.takeaway-done{margin-top:18px; font-size:20px; color:var(--green-d); font-weight:700}

/* Konfetti */
.confetti{position:fixed; top:-20px; width:12px; height:18px; z-index:30; pointer-events:none; border-radius:3px; animation:fall linear forwards}

@keyframes slideIn{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
@keyframes pop{0%{transform:scale(.92)} 60%{transform:scale(1.03)} 100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)}}
@keyframes bump{0%,100%{transform:scale(1)} 50%{transform:scale(1.18)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0)} 50%{box-shadow:0 0 0 6px var(--accent-l)}}
@keyframes floatUp{from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(-70px)}}
@keyframes starIn{0%{opacity:0; transform:scale(.3) rotate(-30deg)} 70%{transform:scale(1.15)} 100%{opacity:1; transform:none}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation:none !important; transition:none !important}
}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header class="topbar hidden" id="topbar">
  <div class="topbar-inner">
    <div class="progress" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>

  </div>

<main id="app"></main>
<div class="sr" aria-live="polite" id="live"></div>

<script>
"use strict";

/* =========================================================
   INHALTE – alle Fakten stammen aus dem Arbeitsblatt der Reihe
   ========================================================= */
var ROUNDS = [
  {
    id: 1, title: "Tropen im Einkaufswagen", emoji: "🛒",
    color: "#E3A500", ink: "#2A2118", light: "#FFF3CC", text: "#8A5A00",
    intro: "Auf dem Arbeitsblatt hast du überlegt: Was haben Schokolade, Kekse und Seife mit den Tropen zu tun?",
    questions: [
      {
        id: "r1q1", type: "mc", lead: "Erinnerst du dich?",
        q: "Die Leitfrage auf dem Arbeitsblatt war: Was haben Schokolade, Kekse und Seife mit den Tropen zu tun?",
        term: ["Tropen", "ein Gebiet rund um die Mitte der Erde. Dort ist es das ganze Jahr warm."],
        options: [
          { t: "Sie werden nur in den Tropen verkauft." },
          { t: "In ihnen stecken Zutaten aus den Tropen, zum Beispiel Kakao oder Palmöl.", ok: true },
          { t: "Sie werden alle aus Äpfeln gemacht." },
          { t: "Gar nichts. Alles kommt aus Deutschland." }
        ],
        hint: "Denk an die Zutaten. Woraus wird Schokolade gemacht?",

      {

        q: "Wo wachsen sie? Ordne zu.",
        targets: [
          { id: "T", label: "Wächst in den Tropen", em: "🌴" },
          { id: "D", label: "Wächst auch bei uns in Deutschland", em: "🏡" }
        ],
        items: [
          { t: "Banane", em: "🍌", to: "T" },
          { t: "Apfel", em: "🍎", to: "D" },
          { t: "Kakao", em: "🍫", to: "T" },
          { t: "Kaffee", em: "☕", to: "T" },
          { t: "Kartoffel", em: "🥔", to: "D" },
          { t: "Ananas", em: "🍍", to: "T" }
        ],
        hint: "Zwei Pflanzen findest du auch auf Feldern und in Gärten in Deutschland.",
        explain: "Banane, Kakao, Kaffee und Ananas wachsen in den Tropen. Äpfel und Kartoffeln wachsen auch bei uns in Deutschland."
      },
      {
        id: "r1q3", type: "mc", two: true,
        q: "Welche Pflanze aus den Tropen braucht man für Schokolade?",
        options: [
          { t: "Kartoffel", em: "🥔" },
          { t: "Ananas", em: "🍍" },
          { t: "Apfel", em: "🍎" },
          { t: "Kakao", em: "🍫", ok: true }
        ],
        hint: "Diese Pflanze hat Bohnen. Aus den Bohnen wird Schokolade gemacht.",
        explain: "Schokolade wird aus Kakaobohnen gemacht. Kakao wächst in den Tropen."
      },
      {
        id: "r1q4", type: "tf",
        q: "Äpfel wachsen nur in den Tropen.",
        answer: false,
        hint: "Schau auf deine Sortierung vom Arbeitsblatt: Wo lag der Apfel?",
        explain: "Falsch. Äpfel wachsen auch bei uns in Deutschland. Sie müssen nicht aus den Tropen kommen."
      }
    ]
  },
  {

function h(tag, attrs) {

  if (attrs) for (var k in attrs) {
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
  return e;
}
function add(e, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { add(e, x); }); return; }
  e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
}

var Speech = (function () {

  if (ok) { loadVoice(); if (speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", loadVoice); }

function speakText(q) {
  var parts = [];
  if (q.lead) parts.push(q.lead);
  if (q.type === "tf") parts.push("Wahr oder falsch?");
  parts.push(q.q);
  if (q.sub) parts.push(q.sub);
  var L = "ABCDEFG";
  if (q.type === "mc") q._opts.forEach(function (o, i) { parts.push("Antwort " + L[i] + ": " + o.t + "."); });
  if (q.type === "tf") parts.push("Antwort A: Wahr. Antwort B: Falsch.");
  if (q.type === "multi") { parts.push("Die Antworten:"); q._opts.forEach(function (o) { parts.push(o.t + "."); }); }
  if (q.type === "opinion") q.options.forEach(function (o) { parts.push(o.t + "."); });
  if (q.type === "detect") q.packs.forEach(function (p) { parts.push("Zutatenliste " + p.title + ": " + p.items.map(function (i) { return i.t; }).join(", ") + "."); });
  if (q.type === "match") {
    parts.push("Die Karten: " + q._items.map(function (i) { return i.t; }).join(", ") + ".");
    parts.push("Die Felder: " + q.targets.map(function (t) { return t.label; }).join(" und ") + ".");
  }
  if (q.type === "gap") {
    parts.push(q.text.map(function (p) { return typeof p === "number" ? " Lücke " : p; }).join(""));
    parts.push("Diese Wörter kannst du einsetzen: " + q._bank.join(", ") + ".");
  }
  if (q.term) parts.push("Erklärung: " + q.term[0] + " heißt: " + q.term[1]);
  return parts.join(" ");
}

function multiLogic(q, opts, btns, api) {
  var sel = opts.map(function () { return false; });
  btns.forEach(function (b, i) {
    b.addEventListener("click", function () {
      if (api.state.done || b.disabled) return;
      sel[i] = !sel[i];
      b.classList.toggle("sel", sel[i]);
      b.setAttribute("aria-pressed", sel[i] ? "true" : "false");
      api.enableCheck(sel.some(Boolean));
    });
    b.setAttribute("aria-pressed", "false");
  });
  api.setCheck(function () {
    var wrongSel = [], missing = 0;
    opts.forEach(function (o, i) { if (sel[i] && !o.ok) wrongSel.push(i); if (!sel[i] && o.ok) missing++; });
    var correct = wrongSel.length === 0 && missing === 0;
    if (correct) {
      btns.forEach(function (b, i) { b.disabled = true; if (sel[i]) { b.classList.remove("sel"); b.classList.add("ok"); } });
      api.submit(true, { anchor: btns[0] });
      return;
    }
    var msg = [];
    if (wrongSel.length) msg.push("Rot markierte Antworten passen nicht.");
    if (missing) msg.push(missing === 1 ? "Eine richtige Antwort fehlt noch." : "Es fehlen noch " + missing + " richtige Antworten.");
    api.submit(false, {
      retryMsg: msg.join(" "),
      onRetry: function () {
        wrongSel.forEach(function (i) { btns[i].classList.remove("sel"); btns[i].classList.add("bad"); });
        setTimeout(function () {
          wrongSel.forEach(function (i) { sel[i] = false; btns[i].classList.remove("bad"); btns[i].setAttribute("aria-pressed", "false"); });
          api.enableCheck(sel.some(Boolean));
        }, 1100);
      },
      onReveal: function () {
        btns.forEach(function (b, i) {
          b.disabled = true; b.classList.remove("sel");
          if (opts[i].ok) { b.classList.add("ok"); if (!sel[i]) b.classList.add("miss"); }
          else if (sel[i]) b.classList.add("bad");
        });
      }
    });
  });
}

RENDER.match = function (q, body, api) {

  var selected = null;
  var pool = h("div", { class: "pool", "aria-label": "Karten" });
  var tBoxes = {};

    place[i] = null;
    var c = h("button", { class: "mcard", onclick: function (e) {
      e.stopPropagation();
      if (api.state.done) return;
      // Ist schon eine Karte ausgewählt, zählt ein Tipp auf eine verteilte Karte als Tipp auf deren Feld
      if (selected !== null && selected !== i && place[i] !== null) { drop(place[i]); return; }
      if (locked[i]) return;
      if (place[i] !== null) { place[i] = null; selected = null; draw(); return; }  // zurück in den Stapel
      selected = selected === i ? null : i; draw();
    } }, emSpan(it.em), h("span", null, it.t));
    return c;
  });
  var targetsEl = h("div", { class: "targets" });
  q.targets.forEach(function (t) {

      onclick: function () { drop(t.id); }, onkeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); drop(t.id); } } },
      h("div", { class: "target-title" }, emSpan(t.em), h("span", null, t.label)), list);
    tBoxes[t.id] = { box: box, list: list };
    targetsEl.appendChild(box);

    cards.forEach(function (c, i) {

  body.appendChild(pool);

      onRetry: function () {

      body.appendChild(h("div", { class: "feedback neutral" },
        h("span", { class: "big", "aria-hidden": "true" }, "💬"),
        h("div", null, h("h3", null, "Danke für deine Meinung!"), h("p", null, "Für diese Frage gibt es keine Punkte. Überlege: Welcher Grund ist für dich am wichtigsten?"))));
      api.finishOpinion();
    } }, h("span", { class: "em", "aria-hidden": "true" }, o.em), h("span", null, o.t));
    return b;
  });
  add(grid, btns); body.appendChild(grid);
};

/* =========================================================
   ABSCHLUSS
   ========================================================= */
function showTakeaway() {
  setAccent(null);
  var done = h("div", { "aria-live": "polite" });
  var next = h("div", { class: "btn-row" });
  var btns = TAKEAWAY.map(function (o) {
    var b = h("button", { class: "opt", onclick: function () {
      btns.forEach(function (x) { x.classList.remove("sel"); x.setAttribute("aria-pressed", "false"); });
      b.classList.add("sel"); b.setAttribute("aria-pressed", "true");
      done.innerHTML = ""; done.appendChild(h("p", { class: "takeaway-done center" }, "Gute Idee! Das kannst du schon morgen ausprobieren. 🌱"));
      next.innerHTML = ""; next.appendChild(h("button", { class: "btn big green", onclick: showResult }, "Mein Ergebnis ▶"));
    } }, emSpan(o.em), h("span", null, o.t));
    return b;
  });
  var spk = Speech.ok ? h("button", { class: "tool", "aria-pressed": "false", "data-label": "Vorlesen", onclick: function () {
    Speech.speak("Das nehme ich mit. Wähle einen Satz, der zu dir passt. " + TAKEAWAY.map(function (t) { return t.t; }).join(" "), spk);
  } }, h("span", { class: "ico", "aria-hidden": "true" }, "🔊"), h("span", { class: "lbl" }, "Vorlesen")) : null;
  var node = h("section", { class: "card" },
    h("div", { class: "qhead" }, h("span", { class: "chip round" }, "🎒 Zum Schluss"), h("span", { class: "chip sheet" }, "📄 Die ganze Reihe")),
    h("div", { class: "tools" }, spk),
    h("h2", { class: "qtext" }, "Das nehme ich mit"),
    h("p", { style: "margin:0 0 16px;color:var(--muted)" }, "Wähle einen Satz, der zu dir passt. Hier gibt es kein Richtig oder Falsch."),
    h("div", { class: "opts" }, btns), done, next);
  screen(node, true);
}

function starSVG(on) {
  var d = document.createElement("div");
  d.innerHTML = '<svg viewBox="0 0 24 24" class="' + (on ? "on" : "") + '" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z" fill="' + (on ? "#F4C430" : "#E8DFD0") + '" stroke="' + (on ? "#C99A00" : "#D5C9B5") + '" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  return d.firstChild;
}
function badgeSVG(em, color) {
  var d = document.createElement("div");
  d.innerHTML = '<svg class="badge" viewBox="0 0 120 140" aria-hidden="true">' +
    '<path d="M38 80 L24 132 L44 122 L54 138 L62 90Z" fill="#6B3F24"/>' +
    '<path d="M82 80 L96 132 L76 122 L66 138 L58 90Z" fill="#14502F"/>' +
    '<circle cx="60" cy="58" r="50" fill="#F4C430"/><circle cx="60" cy="58" r="42" fill="' + color + '"/>' +
    '<circle cx="60" cy="58" r="42" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="4 6" opacity=".7"/>' +
    '<text x="60" y="74" text-anchor="middle" font-size="44">' + em + '</text></svg>';
  return d.firstChild;
}

function showResult() {
  setAccent(null);
  var pct = S.score / TOTAL_MAX;
  var stars = S.score >= 28 ? 3 : S.score >= 18 ? 2 : 1;
  var badge = stars === 3 ? { n: "Tropen-Profi", em: "🏆", c: "#1E6B45" }
            : stars === 2 ? { n: "Fair-Detektiv", em: "🔍", c: "#D9661F" }
            : { n: "Tropen-Entdecker", em: "🌱", c: "#2E8B57" };
  S.mistakes = [];
  ROUNDS.forEach(function (r) { r.questions.forEach(function (q) { if (isScored(q) && S.results[q.id] !== 2) S.mistakes.push(q.id); }); });
  var starRow = h("div", { class: "stars", role: "img", "aria-label": stars + " von 3 Sternen" }, [1, 2, 3].map(function (i) { return starSVG(i <= stars); }));
  var node = h("section", { class: "card center" },
    h("div", { class: "round-kicker" }, "Geschafft!"),
    h("h2", { class: "round-title" }, "Dein Ergebnis"),
    starRow,
    h("div", { class: "stat" }, h("b", null, S.score + " / " + TOTAL_MAX), h("span", null, "Punkte")),
    badgeSVG(badge.em, badge.c),
    h("div", { class: "badge-name" }, "Abzeichen: " + badge.n),
    h("p", { class: "motiv" }, stars === 3 ? "Wow! Du kennst dich mit den Tropen, Palmöl und Fairtrade richtig gut aus."
      : stars === 2 ? "Gut gemacht! Du weißt schon viel über Landwirtschaft in den Tropen."
      : "Du hast durchgehalten! Mit dem Fehler-Training wirst du noch besser."),
    h("div", { class: "teacher" }, h("span", { class: "em", "aria-hidden": "true" }, "👩‍🏫"), "Zeig dein Ergebnis deiner Lehrkraft."),
    endButtons()
  );
  screen(node, false);
  confetti(stars === 3 ? 90 : stars === 2 ? 60 : 40);
}

function showRepeatEnd() {
  setAccent(null);
  var n = S.plan[0].qs.length;
  var fixed = S.plan[0].qs.filter(function (q) { return S.results[q.id] === 2; }).length;
  S.mistakes = S.plan[0].qs.filter(function (q) { return S.results[q.id] !== 2; }).map(function (q) { return q.id; });
  var node = h("section", { class: "card center" },
    h("div", { class: "round-emoji", "aria-hidden": "true" }, fixed === n ? "🏆" : "💪"),
    h("h2", { class: "round-title" }, "Fehler-Training geschafft!"),
    h("div", { class: "stat" }, h("b", null, fixed + " / " + n), h("span", null, "Fragen jetzt beim ersten Versuch richtig")),
    h("p", { class: "motiv" }, fixed === n ? "Alle Fehler ausgebügelt. Stark!" : "Du wirst immer besser. Übe die restlichen Fragen noch einmal."),
    h("div", { class: "teacher" }, h("span", { class: "em", "aria-hidden": "true" }, "👩‍🏫"), "Zeig dein Ergebnis deiner Lehrkraft."),
    endButtons()
  );
  screen(node, false);
  confetti(fixed === n ? 80 : 40);
}

function endButtons() {
  var hasMistakes = S.mistakes.length > 0;
  return h("div", { class: "btn-row" },
    h("button", { class: "btn big green", onclick: function () { startGame(); } }, "🔄 Nochmal spielen"),
    h("button", { class: "btn big light", disabled: !hasMistakes, onclick: function () { if (hasMistakes) startRepeat(); } },
      hasMistakes ? "🎯 Nur meine Fehler wiederholen (" + S.mistakes.length + ")" : "🎯 Keine Fehler – super!")
  );
}

/* =========================================================
   ANIMATIONEN
   ========================================================= */
function confetti(n) {
  if (reduceMotion) return;
  var colors = ["#1E6B45", "#2E8B57", "#F4C430", "#E3A500", "#6B3F24", "#D9661F", "#1F7FA6"];
  for (var i = 0; i < n; i++) {
    var c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.8 + Math.random() * 1.6) + "s";
    c.style.animationDelay = (Math.random() * .4) + "s";
    c.style.transform = "rotate(" + Math.random() * 360 + "deg)";
    if (Math.random() < .3) { c.style.borderRadius = "50%"; c.style.height = "12px"; }
    document.body.appendChild(c);
    setTimeout((function (el) { return function () { el.remove(); }; })(c), 4200);
  }
}
function plusFloat(text, anchor) {
  if (reduceMotion || !anchor) return;
  var r = anchor.getBoundingClientRect();
  var p = h("div", { class: "plus" }, text);
  p.style.left = (r.left + r.width / 2 - 20) + "px";
  p.style.top = (r.top - 10) + "px";
  document.body.appendChild(p);
  setTimeout(function () { p.remove(); }, 1100);
}

showStart();
</script>
</body>
